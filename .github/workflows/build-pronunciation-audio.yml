name: Build pronunciation audio

on:
  push:
    paths:
      - ".github/workflows/build-pronunciation-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install local speech tools
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate missing American English pronunciation
        shell: bash
        run: |
          set -e
          mkdir -p audio/words
          make_audio () {
            key="$1"
            text="$2"
            if [ ! -f "audio/words/$key.mp3" ]; then
              espeak-ng -v en-us+f3 -s 145 -w "/tmp/$key.wav" "$text"
              ffmpeg -y -loglevel error -i "/tmp/$key.wav" -codec:a libmp3lame -q:a 3 "audio/words/$key.mp3"
            fi
            if [ ! -f "audio/words/$key-slow.mp3" ]; then
              espeak-ng -v en-us+f3 -s 100 -w "/tmp/$key-slow.wav" "$text"
              ffmpeg -y -loglevel error -i "/tmp/$key-slow.wav" -codec:a libmp3lame -q:a 3 "audio/words/$key-slow.mp3"
            fi
          }

          make_audio "alarm" "alarm"
          make_audio "face" "face"
          make_audio "toothpaste" "toothpaste"
          make_audio "towel" "towel"
          make_audio "mirror" "mirror"
          make_audio "hair" "hair"
          make_audio "brush" "brush"
          make_audio "get-dressed" "get dressed"
          make_audio "coffee" "coffee"
          make_audio "shoes" "shoes"

          make_audio "appointment" "appointment"
          make_audio "available" "available"
          make_audio "receipt" "receipt"
          make_audio "change" "change"
          make_audio "queue" "queue"
          make_audio "cashier" "cashier"
          make_audio "entrance" "entrance"
          make_audio "exit" "exit"
          make_audio "elevator" "elevator"
          make_audio "intersection" "intersection"
          make_audio "traffic" "traffic"
          make_audio "shortcut" "shortcut"
          make_audio "pharmacy" "pharmacy"
          make_audio "grocery" "grocery"
          make_audio "aisle" "aisle"
          make_audio "wallet" "wallet"
          make_audio "reservation" "reservation"
          make_audio "delivery" "delivery"
          make_audio "refund" "refund"
          make_audio "crowded" "crowded"

          make_audio "schedule" "schedule"
          make_audio "counter" "counter"
          make_audio "package" "package"
          make_audio "parking" "parking"
          make_audio "address" "address"
          make_audio "nearby" "nearby"
          make_audio "delayed" "delayed"
          make_audio "pickup" "pickup"
          make_audio "exchange" "exchange"
          make_audio "confirm" "confirm"

          make_audio "cancel" "cancel"
          make_audio "reschedule" "reschedule"
          make_audio "location" "location"
          make_audio "directions" "directions"
          make_audio "upstairs" "upstairs"
          make_audio "downstairs" "downstairs"
          make_audio "checkout" "checkout"
          make_audio "contactless" "contactless"
          make_audio "out-of-stock" "out of stock"
          make_audio "return" "return"

          make_audio "actually" "actually"
          make_audio "probably" "probably"
          make_audio "anyway" "anyway"
          make_audio "exactly" "exactly"
          make_audio "seriously" "seriously"
          make_audio "by-the-way" "by the way"
          make_audio "no-worries" "no worries"
          make_audio "hang-on" "hang on"
          make_audio "sounds-good" "sounds good"
          make_audio "i-guess" "I guess"

          make_audio "instead" "instead"
          make_audio "unless" "unless"
          make_audio "enough" "enough"
          make_audio "supposed-to" "supposed to"
          make_audio "figure-out" "figure out"
          make_audio "depends" "depends"
          make_audio "bother" "bother"
          make_audio "realize" "realize"
          make_audio "prefer" "prefer"
          make_audio "manage" "manage"

      - name: Commit generated audio
        shell: bash
        run: |
          git config user.name "reem-english-bot"
          git config user.email "actions@users.noreply.github.com"
          git add audio/words
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "build: add pronunciation audio for Daily Errands lesson [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
